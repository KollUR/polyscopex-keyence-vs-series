@if (contributedNode) {
    <div class="inline-component">
        <ur-dialog-input
            type="text"
            keyboardLayout="alpha-numeric"
            [attr.data-testid]="'vs_command'"
            [label]="'presenter.vs-command.label.command' | translate"
            [value]="contributedNode.parameters.command"
            [placeholder]="'presenter.vs-command.placeholder.command' | translate"
            [validators]="commandValidators"
            [validation]="{ required: true }"
            (valueChanged)="saveCommand($event)"
        >
        </ur-dialog-input>

        <hr class="vertical" />

        <ur-checkbox
            [attr.data-testid]="'vs_command_wait'"
            [label]="'presenter.vs-command.label.wait_for_reply' | translate"
            [checked]="contributedNode.parameters.waitForReply"
            (handleChange)="toggleWaitForReply()"
        >
        </ur-checkbox>

        <ur-dropdown
            [numberOfOptionsVisible]="4"
            [options]="variableOptions"
            [enableAddition]="false"
            [label]="'presenter.vs-command.label.variable' | translate"
            [labelOutside]="false"
            [clearable]="false"
            [allowsOptionCreation]="true"
            [createLabel]="'presenter.vs-command.action.add_variable' | translate"
            [createLabelIcon]="'plus'"
            [createValue]="''"
            [validators]="variableValidators"
            [required]="false"
            [placeholder]="'presenter.vs-command.placeholder.variable' | translate"
            [selectedOption]="selectedVariableOption"
            [disabled]="!contributedNode.parameters.waitForReply"
            [attr.data-testid]="'vs_command_variable'"
            (selectionChange)="onVariableSelectionChange($event)"
            (optionAdd)="onVariableOptionAdd($event)"
        ></ur-dropdown>

        <ur-icon-button
            icon="info"
            size="small"
            [attr.data-testid]="'vs_command_info'"
            [attr.aria-label]="'presenter.vs-command.action.show_info' | translate"
            (clicked)="openInfoDialog('presenter.vs-command.info.title', 'presenter.vs-command.info.text')"
        >
        </ur-icon-button>
    </div>
}
